name: Attach release checksums

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux installer tarball
        run: smb-share-wizard/packaging/deb/dist.sh

      - name: Upload tarball + checksum to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            smb-share-wizard/packaging/deb/nassie-linux-installer.tar.gz \
            smb-share-wizard/packaging/deb/nassie-linux-installer.tar.gz.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WiX v5 CLI
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Build NASsie.msi
        working-directory: smb-share-wizard/packaging/windows
        run: .\build.ps1

      # build.ps1 leaves the PyInstaller NASsie.exe next to the MSI it just
      # packed it into. Sign that exe, then rebuild the MSI so it embeds the
      # signed copy, then sign the MSI wrapper itself.
      - name: Sign NASsie.exe with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: NASsie
          certificate-profile-name: NASsie-Public-Trust
          files-folder: ${{ github.workspace }}\smb-share-wizard\packaging\windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Rebuild NASsie.msi around the signed exe
        working-directory: smb-share-wizard/packaging/windows
        run: |
          wix build nassie.wxs -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -out NASsie.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

      - name: Sign NASsie.msi with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: NASsie
          certificate-profile-name: NASsie-Public-Trust
          files-folder: ${{ github.workspace }}\smb-share-wizard\packaging\windows
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify MSI signature
        shell: pwsh
        run: |
          foreach ($f in 'NASsie.exe', 'NASsie.msi') {
            $sig = Get-AuthenticodeSignature "smb-share-wizard/packaging/windows/$f"
            $sig | Format-List Status, StatusMessage, SignerCertificate
            if ($sig.Status -ne 'Valid') { throw "$f signature is $($sig.Status)" }
          }

      - name: Upload MSI + checksum to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smb-share-wizard/packaging/windows
          sha256sum NASsie.msi > NASsie.msi.sha256
          gh release upload "${{ github.event.release.tag_name }}" \
            NASsie.msi NASsie.msi.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

  checksums:
    needs: [build-linux-installer, build-msi]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir assets \
            --clobber

      - name: Generate checksums.txt
        run: |
          cd assets
          rm -f checksums.txt
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload checksums.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            assets/checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber
